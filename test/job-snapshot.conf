env {
  parallelism = 2
  job.mode = "BATCH"
}
source {
  CosmosMongo {
    uri = "mongodb://127.0.0.1:27117/?directConnection=true"
    database = "shop"
    startup.mode = "snapshot"
    poll.batch_size = 500
  }
}
sink {
  DocumentDB {
    uri = "mongodb://127.0.0.1:27118/"
    batch_size = 500
  }
}
