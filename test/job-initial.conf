env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}
source {
  CosmosMongo {
    uri = "mongodb://127.0.0.1:27117/?directConnection=true"
    database = "shop"
    startup.mode = "initial"
    change_stream.mode = "cosmos_ru"
    # small batches so the snapshot takes a while and overlaps the writer
    poll.batch_size = 200
    snapshot.fetch_size = 200
  }
}
sink {
  DocumentDB {
    uri = "mongodb://127.0.0.1:27118/"
    batch_size = 500
    batch_interval_ms = 500
  }
}
